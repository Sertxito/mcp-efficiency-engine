name: Release & Publish NPM

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      npm_version:
        description: Optional confirmation of the committed version; must match package.json.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate committed release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.npm_version }}
        run: |
          npm view mcp-efficiency-engine version --json > "$RUNNER_TEMP/registry-version.json"
          node scripts/check-release-version.js "$RUNNER_TEMP/registry-version.json"
      - name: Require existing npm publishing secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is required."
            exit 1
          fi
      - name: Recheck package and create deployment artifact
        run: |
          npm run pack:check
          mkdir -p "$RUNNER_TEMP/mcpee-publish"
          npm pack --pack-destination "$RUNNER_TEMP/mcpee-publish"
      - name: Publish committed version to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm publish "$RUNNER_TEMP/mcpee-publish/mcp-efficiency-engine-$RELEASE_VERSION.tgz" --access public
      - name: Verify registry publication
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # npm can take several minutes to expose a fresh version on the registry read path.
          for attempt in $(seq 1 60); do
            if npm view "mcp-efficiency-engine@$RELEASE_VERSION" version --prefer-online --cache "$RUNNER_TEMP/npm-verify-$attempt" --json > "$RUNNER_TEMP/published-version.json" &&
              node -e 'const fs = require("node:fs"); if (JSON.parse(fs.readFileSync(process.argv[1], "utf8")) !== process.env.RELEASE_VERSION) process.exit(1)' "$RUNNER_TEMP/published-version.json"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published version could not be verified in npm."
          exit 1
      - name: Create GitHub release for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --generate-notes
          echo "Published mcp-efficiency-engine@$RELEASE_VERSION from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
