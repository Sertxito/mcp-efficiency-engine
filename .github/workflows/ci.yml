name: MCPEE CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate MCPEE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Bicep for native acceptance
        shell: pwsh
        run: |
          $asset = if ($IsWindows) { "bicep-win-x64.exe" } else { "bicep-linux-x64" }
          $executable = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "https://github.com/Azure/bicep/releases/download/v0.39.26/$asset" -OutFile $executable
          if (-not $IsWindows) {
            & chmod +x $executable
            if ($LASTEXITCODE -ne 0) { throw "Cannot enable the pinned Bicep executable." }
          }
          $version = & $executable --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^Bicep CLI version 0\.39\.26\b') {
            throw "Pinned Bicep verification failed: $version"
          }
          "MCPEE_BICEP_PATH=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test runtime and catalog
        run: npm test
      - name: Audit dependency advisories
        run: npm run audit:dependencies
      - name: Validate local documentation
        run: npm run docs:check-links
      - name: Validate installed npm package
        run: npm run pack:check
